<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLOCKFORT 3D - Zombie Survival</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Teko:wght@600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; user-select: none; overflow: hidden; background-color: #1e293b; color: #fff; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-teko { font-family: 'Teko', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.12); }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%); pointer-events: none; z-index: 20; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 4px rgba(0,0,0,0.8); }
        #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
        #crosshair::after { top: 8px; left: 0; width: 18px; height: 2px; }
        .btn-glow { box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); transition: all 0.2s ease-in-out; }
        .btn-glow:hover { box-shadow: 0 0 30px rgba(239, 68, 68, 0.8); transform: translateY(-2px); }
    </style>
</head>
<body class="h-full w-full select-none overflow-hidden bg-slate-950 text-slate-100">

    <div id="canvas-container" class="absolute inset-0 z-0"></div>
    <div id="crosshair" class="hidden"></div>

    <!-- MENU PRINCIPAL -->
    <div id="start-menu-overlay" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md overflow-y-auto">
        <div class="relative w-full max-w-2xl flex flex-col glass-panel rounded-2xl border border-red-500/30 shadow-2xl overflow-hidden">
            <div class="bg-slate-900/95 border-b border-slate-800 p-5 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-red-600/20 border border-red-500 flex items-center justify-center text-red-500 text-xl font-black">
                        <i class="fa-solid fa-cube"></i>
                    </div>
                    <div>
                        <h1 class="font-orbitron font-black text-xl text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-amber-300">BLOCKFORT 3D</h1>
                        <p class="text-[11px] text-slate-400 font-semibold">ZOMBIE SURVIVAL HD VOXEL</p>
                    </div>
                </div>
                <button id="btn-quick-start" class="btn-glow px-5 py-2.5 bg-gradient-to-r from-red-600 to-amber-600 text-white font-orbitron font-bold text-xs rounded-xl">JOUER</button>
            </div>

            <div class="p-6 space-y-5">
                <div class="p-4 bg-gradient-to-r from-red-950/70 via-slate-900/90 to-amber-950/40 rounded-xl border border-red-500/30 flex items-center justify-between">
                    <div>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-500/20 text-red-400 border border-red-500/30">Mode Vagues</span>
                        <h2 class="text-lg font-bold text-slate-100 mt-1">Bâtissez vos défenses & massacrez la horde !</h2>
                    </div>
                    <button id="btn-main-start" class="btn-glow px-6 py-3 bg-red-600 hover:bg-red-500 text-white font-orbitron font-black text-sm rounded-xl flex items-center space-x-2">
                        <i class="fa-solid fa-crosshairs"></i>
                        <span>LANCER</span>
                    </button>
                </div>

                <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                    <label class="block text-xs font-orbitron font-semibold text-slate-300 mb-2 flex justify-between">
                        <span>Sensibilité Souris</span>
                        <span id="sensitivity-value" class="font-mono text-amber-400">0.0025</span>
                    </label>
                    <input type="range" id="mouse-sensitivity" min="0.0005" max="0.008" step="0.00025" value="0.0025" class="w-full accent-red-500 cursor-pointer">
                </div>

                <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                    <h3 class="text-xs font-orbitron font-semibold text-slate-400 mb-2">Commandes</h3>
                    <div class="grid grid-cols-4 gap-2 text-xs text-center">
                        <div class="p-2 bg-slate-950 rounded border border-slate-800"><span class="block text-red-400 font-bold">ZQSD</span>Déplacement</div>
                        <div class="p-2 bg-slate-950 rounded border border-slate-800"><span class="block text-amber-400 font-bold">Clic G/D</span>Tirer / Poser</div>
                        <div class="p-2 bg-slate-950 rounded border border-slate-800"><span class="block text-purple-400 font-bold">Shift</span>Courir</div>
                        <div class="p-2 bg-slate-950 rounded border border-slate-800"><span class="block text-emerald-400 font-bold">1 / 2</span>Bois / Pierre</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD EN JEU -->
    <div id="hud" class="fixed inset-0 z-10 pointer-events-none hidden flex flex-col justify-between p-4">
        <div class="flex items-start justify-between w-full">
            <div class="glass-panel p-3 rounded-2xl flex items-center space-x-4 min-w-[200px]">
                <div class="w-10 h-10 rounded-xl bg-red-600/20 border border-red-500/50 flex items-center justify-center text-red-500">
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="flex-1">
                    <div class="flex justify-between text-xs font-orbitron font-bold mb-1">
                        <span class="text-slate-300">PV</span>
                        <span id="hud-health-txt" class="text-red-400">100 / 100</span>
                    </div>
                    <div class="w-full h-3 bg-slate-900 rounded-full overflow-hidden p-0.5 border border-slate-700">
                        <div id="hud-health-bar" class="h-full bg-gradient-to-r from-red-600 to-emerald-400 rounded-full w-full transition-all"></div>
                    </div>
                </div>
            </div>

            <div class="glass-panel px-6 py-2 rounded-2xl text-center border-amber-500/30">
                <div class="text-[10px] font-orbitron font-bold text-amber-400">SURVIVAL</div>
                <div class="text-2xl font-teko font-black text-white">VAGUE <span id="hud-wave-num" class="text-amber-400">1</span></div>
                <div class="text-xs text-slate-400">SCORE: <span id="hud-score-num" class="text-slate-100 font-mono">0</span></div>
            </div>

            <div class="glass-panel p-3 rounded-2xl flex items-center space-x-4">
                <div class="text-right">
                    <div class="text-xs font-orbitron font-bold text-slate-300">MUNITIONS</div>
                    <div class="text-2xl font-teko font-black text-emerald-400"><span id="hud-ammo-cur">30</span> / 120</div>
                </div>
            </div>
        </div>

        <div class="flex items-end justify-between w-full">
            <div class="glass-panel p-2 rounded-2xl pointer-events-auto flex items-center space-x-2">
                <div id="slot-wood" class="border-2 border-amber-500 bg-amber-950/50 p-2 rounded-xl cursor-pointer text-center">
                    <span class="text-[10px] font-bold block text-slate-200">BOIS [1]</span>
                    <span id="count-wood" class="text-xs font-mono font-bold text-amber-400">50</span>
                </div>
                <div id="slot-stone" class="border border-slate-700 bg-slate-900/50 p-2 rounded-xl cursor-pointer text-center">
                    <span class="text-[10px] font-bold block text-slate-200">PIERRE [2]</span>
                    <span id="count-stone" class="text-xs font-mono font-bold text-slate-400">25</span>
                </div>
            </div>
        </div>
    </div>

    <!-- GAME OVER -->
    <div id="game-over-overlay" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 hidden">
        <div class="w-full max-w-md glass-panel p-6 rounded-2xl border border-red-500/40 text-center">
            <div class="w-16 h-16 rounded-full bg-red-600/20 border-2 border-red-500 flex items-center justify-center text-red-500 text-3xl mx-auto mb-4">
                <i class="fa-solid fa-skull"></i>
            </div>
            <h2 class="font-orbitron font-black text-2xl text-red-500">VOUS ÊTES MORT</h2>
            <button id="btn-restart" class="mt-6 w-full btn-glow py-3 bg-red-600 text-white font-orbitron font-bold rounded-xl">RECOMMENCER</button>
        </div>
    </div>

    <script>
        let MOUSE_SENSITIVITY = 0.0025;
        const sensitivitySlider = document.getElementById('mouse-sensitivity');
        const sensitivityValueDisplay = document.getElementById('sensitivity-value');
        sensitivitySlider.addEventListener('input', (e) => {
            MOUSE_SENSITIVITY = parseFloat(e.target.value);
            sensitivityValueDisplay.textContent = MOUSE_SENSITIVITY.toFixed(5);
        });

        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lumières
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(30, 50, 30);
        scene.add(dirLight);

        // Sol
        const floorGeo = new THREE.BoxGeometry(100, 2, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x3b6e1a });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.position.set(0, -1, 0);
        scene.add(floorMesh);

        // Contrôles Joueur FPS
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, isRunning = false;
        let pitch = 0, yaw = 0;
        let playerHealth = 100, ammo = 30, score = 0, wave = 1;
        let blocksWood = 50, blocksStone = 25, selectedBlockType = 'wood';

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'KeyZ') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA' || e.code === 'KeyQ') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;
            if (e.code === 'ShiftLeft') isRunning = true;
            if (e.code === 'Digit1') selectBlock('wood');
            if (e.code === 'Digit2') selectBlock('stone');
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'KeyZ') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA' || e.code === 'KeyQ') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
            if (e.code === 'ShiftLeft') isRunning = false;
        });

        let isPointerLocked = false;
        renderer.domElement.addEventListener('click', () => {
            if (!document.pointerLockElement && !startMenuOverlay.classList.contains('hidden') === false) {
                renderer.domElement.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = (document.pointerLockElement === renderer.domElement);
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPointerLocked) return;
            yaw -= e.movementX * MOUSE_SENSITIVITY;
            pitch -= e.movementY * MOUSE_SENSITIVITY;
            pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

            camera.rotation.set(0, 0, 0);
            camera.rotateY(yaw);
            camera.rotateX(pitch);
        });

        function selectBlock(type) {
            selectedBlockType = type;
            document.getElementById('slot-wood').className = type === 'wood' ? 'border-2 border-amber-500 bg-amber-950/50 p-2 rounded-xl text-center' : 'border border-slate-700 bg-slate-900/50 p-2 rounded-xl text-center';
            document.getElementById('slot-stone').className = type === 'stone' ? 'border-2 border-slate-400 bg-slate-800 p-2 rounded-xl text-center' : 'border border-slate-700 bg-slate-900/50 p-2 rounded-xl text-center';
        }

        // Boucle de Jeu & Déplacement fluide
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const speed = (isRunning ? 9 : 5) * delta;

            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0;
            dir.normalize();

            const sideDir = new THREE.Vector3(-dir.z, 0, dir.x);

            if (moveForward) camera.position.addScaledVector(dir, speed);
            if (moveBackward) camera.position.addScaledVector(dir, -speed);
            if (moveLeft) camera.position.addScaledVector(sideDir, speed);
            if (moveRight) camera.position.addScaledVector(sideDir, -speed);

            camera.position.y = 2; // Maintenir hauteur fixe sol

            renderer.render(scene, camera);
        }
        animate();

        // Gestion Menus
        function startGame() {
            startMenuOverlay.classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('crosshair').classList.remove('hidden');
            renderer.domElement.requestPointerLock();
        }

        document.getElementById('btn-quick-start').addEventListener('click', startGame);
        document.getElementById('btn-main-start').addEventListener('click', startGame);
        document.getElementById('btn-restart').addEventListener('click', () => location.reload());

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
